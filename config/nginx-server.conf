# Exemple de serveur Nginx pour Mosquee Ridwane.
# Adapter server_name, root et fastcgi_pass a l'hebergement.
server {
    listen 80;
    server_name example.com;
    root /var/www/mosquee-ridwane;
    index index.php;

    location / {
        try_files $uri $uri/ @mosquee_extensionless;
    }

    location @mosquee_extensionless {
        rewrite ^/(.*?)/?$ /$1.php last;
    }

    location ~ \.php$ {
        if ($request_uri ~ "^(.+)\.php(?:\?|$)") {
            return 301 $1$is_args$args;
        }

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
