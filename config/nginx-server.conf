server {
    listen 80;
    server_name 13.140.200.138; # Remplacerez par votre nom de domaine plus tard

    root /var/www/mosquee-ridwane;
    index index.php index.html index.htm;

    charset utf-8;

    # Gestion des erreurs personnalisées
    error_page 403 = /403.php;
    error_page 404 = /404.php;
    error_page 500 502 503 504 = /erreur-serveur.php;

    # Routes admin explicites : la réécriture interne conserve la méthode POST.
    location = /admin {
        rewrite ^ /admin/index.php last;
    }

    location = /admin/ {
        rewrite ^ /admin/index.php last;
    }

    # Ne pas utiliser ^~ ici : cela empêcherait le bloc PHP regex de matcher.
    location /admin/ {
        try_files $uri $uri/ @admin_sans_extension;
    }

    location @admin_sans_extension {
        rewrite ^/admin/(.*?)/?$ /admin/$1.php last;
    }

    # Servir les fichiers et dossiers existants, puis réécrire les routes
    # publiques sans extension vers leur script PHP.
    location / {
        try_files $uri $uri/ @public_sans_extension;
    }

    location @public_sans_extension {
        rewrite ^/(.*?)/?$ /$1.php last;
    }

    # Les fichiers sensibles et les fichiers uploadés ne doivent jamais être
    # exécutés comme du PHP.
    location ~* ^/assets/uploads/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(config|database|includes)/ {
        deny all;
        return 404;
    }

    # Les scripts PHP ne sont jamais servis comme des fichiers statiques.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

}