server {
    listen 80;
    server_name 13.140.200.138; # Remplacerez par votre nom de domaine plus tard

    root /var/www/mosquee-ridwane;
    index index.php index.html index.htm;

    charset utf-8;

    # Gestion des erreurs personnalisées
    error_page 403 = /403.php;
    error_page 404 = /404.php;
    error_page 500 502 503 504 = /erreur-serveur.php;

    # Le chemin /admin est aussi un dossier physique : le router explicitement
    # évite que Nginx traite l'envoi du formulaire comme une URL de répertoire.
    location = /admin {
        rewrite ^ /admin/index.php last;
    }

    location = /admin/ {
        rewrite ^ /admin/index.php last;
    }

    # Gestion des URLs propres (sans extension .php)
    location / {
        try_files $uri $uri.php $uri/ /index.php?$query_string;
    }

    # Les fichiers sensibles et les fichiers uploadés ne doivent jamais être
    # exécutés comme du PHP.
    location ~* ^/assets/uploads/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(config|database|includes)/ {
        deny all;
        return 404;
    }

    # Transmettre explicitement les scripts PHP à PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

}